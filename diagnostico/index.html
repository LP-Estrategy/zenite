<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico da Trinca · Zênite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Jost:wght@300;400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--g:#0F3B34;--g2:#0B2A25;--i:#EFEADF;--i2:#EDE7DA;--c:#FDFBF6;--o:#9C8654;--o2:#C9B27E;--t:#14312C}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
body{margin:0;background:var(--g);color:var(--i);font-family:Jost,system-ui,sans-serif;font-weight:300}
h1,h2,h3,p{margin:0;text-wrap:pretty}
a{color:var(--o2);text-decoration:none}a:hover{color:var(--i)}
button{font-family:Jost,sans-serif;cursor:pointer}
input{font-family:Jost,sans-serif;width:100%;background:transparent;border:0;border-bottom:1px solid rgba(20,49,44,.22);padding:6px 0 12px;font-size:20px;font-weight:300;color:var(--t)}
input:focus{outline:none;border-bottom-color:var(--g)}
input::placeholder{color:rgba(20,49,44,.3)}
.shell{max-width:1180px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 90px rgba(0,0,0,.35)}
.side{position:relative;overflow:hidden;background:var(--g);display:flex;flex-direction:column;justify-content:space-between;gap:16px;padding:18px 20px 20px}
.side:before{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 82% 6%,rgba(46,107,93,.85),rgba(9,33,28,.96) 64%)}
.side:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(239,234,223,.07) 1px,transparent 1.2px);background-size:38px 42px}
.side>*{position:relative}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:44px;height:44px}
.wm{font-weight:500;font-size:17px;letter-spacing:.3em}
.tri{font-size:11px;letter-spacing:.28em;color:var(--o2)}
.kick{font-size:12px;letter-spacing:.26em;color:var(--o2)}
.pct{font-weight:500;font-size:17px}
.ticks{display:flex;gap:4px}
.ticks i{flex:1;height:4px;border-radius:2px;background:rgba(239,234,223,.18);transition:background .3s}
.ticks i.on{background:var(--o2)}.ticks i.now{background:var(--i)}
.steplab{font-size:12px;letter-spacing:.2em;color:rgba(239,234,223,.6)}
.main{position:relative;flex:1;background:var(--i2);color:var(--t);display:flex;flex-direction:column;min-height:0}
.main:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(120,104,74,.15) .9px,transparent 1px);background-size:37px 41px;pointer-events:none}
.pane{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:32px 22px 40px;animation:rise .38s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.28;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;background:rgba(15,59,52,.09);border-radius:100px;padding:8px 16px;font-size:11px;letter-spacing:.24em;color:var(--g)}
.badge b{width:6px;height:6px;border-radius:50%;background:var(--o);display:block}
.badge.money{background:rgba(156,134,84,.22)}
h1.q,h2.q{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,7.6vw,48px);line-height:1.02;letter-spacing:-.02em;color:var(--g)}
p.sub{font-size:clamp(14px,4vw,17px);font-weight:400;line-height:1.5;color:rgba(20,49,44,.68);border-left:3px solid var(--o);padding-left:14px}
.card{background:var(--c);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 42px rgba(20,49,44,.1)}
label{font-size:11px;letter-spacing:.26em;color:var(--o)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;text-align:left;font-weight:400;font-size:clamp(15px,4.2vw,18px);line-height:1.35;color:var(--t);background:var(--c);border:1px solid rgba(20,49,44,.1);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 18px rgba(20,49,44,.05);transition:transform .17s,box-shadow .17s,border-color .17s}
.opt:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 14px 26px rgba(20,49,44,.1)}
.opt i{width:31px;height:31px;flex:none;border-radius:50%;background:rgba(15,59,52,.07);display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal;color:var(--g)}
.sex{display:flex;gap:10px}
.sex button{flex:1;font-weight:300;font-size:16px;color:var(--t);background:transparent;border:1px solid rgba(20,49,44,.18);border-radius:16px;padding:15px 18px;letter-spacing:.12em;text-transform:uppercase;transition:all .18s}
.sex button.on{background:var(--g);color:var(--i);border-color:var(--g)}
.cta{width:100%;border:0;background:var(--g);color:var(--i);border-radius:100px;padding:18px 26px;font-size:14px;letter-spacing:.18em;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 26px rgba(15,59,52,.26)}
.cta:hover{background:#14483F}.cta span:last-child{color:var(--o2);font-size:18px}
.cta.gold{background:var(--o);color:var(--g);box-shadow:0 14px 28px rgba(156,134,84,.32)}.cta.gold:hover{background:var(--o2)}
.cta.inline{width:auto;align-self:flex-start;gap:16px;padding:17px 30px;letter-spacing:.16em}
.fine{font-size:12px;line-height:1.55;color:rgba(20,49,44,.5);text-align:center}
.err{font-size:13px;line-height:1.5;color:#9C5A3C}
.fb{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,8vw,48px);line-height:1.04;color:var(--g)}
.fbp{font-size:clamp(15px,4.2vw,19px);font-weight:400;line-height:1.6;color:rgba(20,49,44,.8)}
.rule{width:64px;height:1px;background:rgba(156,134,84,.7)}
.load{display:flex;flex-direction:column;align-items:center;gap:26px;padding:40px 0;text-align:center}
.load svg{width:86px;height:86px}
.load .bar{width:100%;max-width:420px;height:6px;border-radius:4px;background:rgba(20,49,44,.1);overflow:hidden}
.load .bar i{display:block;height:6px;border-radius:4px;background:var(--o);width:0;transition:width .4s linear}
.load .row{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;letter-spacing:.14em;color:rgba(20,49,44,.7)}
.load .row b{font-family:Anton,sans-serif;font-weight:400;font-size:22px;color:var(--o)}
@media(min-width:900px){
 .shell{flex-direction:row}
 .side{flex:1;padding:clamp(30px,3vw,46px);gap:28px}
 .side .brand svg{width:56px;height:56px}.wm{font-size:20px}.pct{font-size:20px}
 .main{flex:1.35}
 .pane{padding:clamp(30px,4vh,52px) clamp(28px,4vw,54px);gap:26px}
}
</style>

<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 200 200" fill="none" aria-hidden="true"><path d="M100 14 116 46 100 78 84 46Z" fill="#C9B27E"/><path d="M70 92c10 14 20 24 30 30 10-6 20-16 30-30v24c-12 10-22 18-30 30-8-12-18-20-30-30Z" fill="#EFEADF"/><path d="M20 100c42 28 68 56 80 92 12-36 38-64 80-92-42 14-66 36-80 60-14-24-38-46-80-60Z" fill="#EFEADF"/></svg>
