document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"position:absolute; inset:0; background:radial-gradient(130% 100% at 76% 6%, rgba(46,107,93,0.9), rgba(9,33,28,0.96) 64%);\"><\u002Fdiv>\n          <div style=\"position:absolute; right:-120px; top:-90px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle at 38% 32%, rgba(214,190,140,0.4), rgba(156,134,84,0.05) 62%, rgba(156,134,84,0));\"><\u002Fdiv>\n          <div style=\"position:relative; display:flex; align-items:center; gap:14px;\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 200 200\" fill=\"none\">\n              <path d=\"M100 14 L116 46 L100 78 L84 46 Z\" fill=\"#C9B27E\"><\u002Fpath>\n              <path d=\"M70 92 C80 106 90 116 100 122 C110 116 120 106 130 92 L130 116 C118 126 108 134 100 146 C92 134 82 126 70 116 Z\" fill=\"#EFEADF\"><\u002Fpath>\n              <path d=\"M20 100 C62 128 88 156 100 192 C112 156 138 128 180 100 C138 114 114 136 100 160 C86 136 62 114 20 100 Z\" fill=\"#EFEADF\"><\u002Fpath>\n            <\u002Fsvg>\n            <div style=\"font-size:11px; letter-spacing:0.28em; color:#C9B27E;\">SEU DIAGNÓSTICO<\u002Fdiv>\n          <\u002Fdiv>\n          <h2 style=\"position:relative; margin:0; font-family:'Cormorant Garamond',serif; font-weight:300; font-size:46px; line-height:1.02; color:#EFEADF; text-wrap:pretty; animation:zrise 500ms cubic-bezier(0.16,1,0.3,1);\">{{ resultTitle }}<\u002Fh2>\n          <p style=\"position:relative; margin:0; font-size:16px; line-height:1.7; color:rgba(239,234,223,0.7); max-width:440px;\">Mas repara numa coisa: os três andam juntos. Um travado puxa os outros.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; background:#EDE7DA; color:#14312C; border-radius:32px 32px 0 0; margin-top:-24px; padding:32px 28px 44px; display:flex; flex-direction:column; gap:32px;\">\n          <div style=\"position:absolute; inset:0; border-radius:32px 32px 0 0; background-image:radial-gradient(rgba(120,104,74,0.16) 0.9px, transparent 1px); background-size:37px 41px; pointer-events:none;\"><\u002Fdiv>\n\n          <div style=\"position:relative; background:#FDFBF6; border-radius:26px; padding:26px 24px; display:flex; flex-direction:column; gap:26px; box-shadow:0 18px 38px rgba(20,49,44,0.1);\">\n            <sc-for list=\"{{ bars }}\" as=\"bar\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; flex-direction:column; gap:10px;\">\n                <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:14px;\">\n                  <div style=\"display:flex; flex-direction:column; gap:3px;\">\n                    <div style=\"font-size:14px; letter-spacing:0.24em; color:#0F3B34;\">{{ bar.name }}<\u002Fdiv>\n                    <div style=\"font-size:13px; color:rgba(20,49,44,0.5);\">{{ bar.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:baseline; gap:8px;\">\n                    <div style=\"font-family:'Cormorant Garamond',serif; font-size:34px; line-height:1; color:{{ bar.color }};\">{{ bar.pct }}<\u002Fdiv>\n                    <div style=\"font-size:10px; letter-spacing:0.18em; color:{{ bar.color }};\">{{ bar.tag }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"height:7px; border-radius:4px; background:rgba(20,49,44,0.1); overflow:hidden;\">\n                  <div style=\"height:7px; border-radius:4px; background:{{ bar.color }}; width:{{ bar.width }}; transition:width 1000ms cubic-bezier(0.16,1,0.3,1);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"position:relative; display:flex; flex-direction:column; gap:18px;\">\n            <div style=\"display:flex; align-items:center; gap:14px;\">\n              <div style=\"font-size:11px; letter-spacing:0.26em; color:#9C8654;\">O QUE ISSO QUER DIZER<\u002Fdiv>\n              <div style=\"flex:1; height:1px; background:rgba(20,49,44,0.18);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-family:'Cormorant Garamond',serif; font-weight:400; font-size:26px; line-height:1.38; color:#0F3B34; text-wrap:pretty;\">{{ para1 }}<\u002Fp>\n            <p style=\"margin:0; font-size:17px; line-height:1.75; color:rgba(20,49,44,0.8); text-wrap:pretty;\">{{ para2 }}<\u002Fp>\n            <p style=\"margin:0; font-size:17px; line-height:1.75; color:rgba(20,49,44,0.8); text-wrap:pretty;\">A boa notícia, e eu vivi isso na pele: o que falta não é informação. Você não precisa assistir mais um vídeo motivacional nem comprar mais um curso. Precisa dar o primeiro passo com o que você já tem na mão, e deixar os três pilares começarem a girar juntos.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"position:relative; background:#0F3B34; border-radius:28px; padding:36px 28px; display:flex; flex-direction:column; gap:18px; overflow:hidden; box-shadow:0 26px 52px rgba(15,59,52,0.3);\">\n            <div style=\"position:absolute; right:-80px; top:-70px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle at 38% 32%, rgba(214,190,140,0.5), rgba(156,134,84,0.06) 62%, rgba(156,134,84,0));\"><\u002Fdiv>\n            <svg width=\"360\" height=\"360\" sc-camel-view-box=\"0 0 200 200\" fill=\"none\" style=\"position:absolute; left:-110px; bottom:-140px; opacity:0.08;\">\n              <path d=\"M20 100 C62 128 88 156 100 192 C112 156 138 128 180 100 C138 114 114 136 100 160 C86 136 62 114 20 100 Z\" fill=\"#EFEADF\"><\u002Fpath>\n            <\u002Fsvg>\n            <div style=\"position:relative; font-family:'Caveat',cursive; font-size:36px; line-height:1; color:#C9B27E;\">A hora certa é agora<\u002Fdiv>\n            <div style=\"position:relative; font-family:'Cormorant Garamond',serif; font-weight:300; font-size:38px; line-height:1.06; color:#EFEADF; text-wrap:pretty;\">Saia da sala de espera com a gente<\u002Fdiv>\n            <p style=\"position:relative; margin:0; font-size:16px; line-height:1.7; color:rgba(239,234,223,0.75); text-wrap:pretty;\">Criei um grupo onde eu aprofundo os três pilares e te empurro pra agir de verdade, um passo por vez. É de graça, e é onde tudo começa.<\u002Fp>\n            <a href=\"https://chat.whatsapp.com/J7y2xIn95cx0br18RbLeey\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ onGroup }}\" style=\"position:relative; display:flex; align-items:center; justify-content:space-between; background:#C9B27E; color:#0F3B34; border-radius:100px; padding:20px 26px; font-size:15px; letter-spacing:0.16em; margin-top:8px; box-shadow:0 14px 26px rgba(0,0,0,0.22);\" style-hover=\"background:#E0CB9C; color:#0F3B34\">\n              <span>QUERO ENTRAR NO GRUPO<\u002Fspan>\n              <span style=\"font-size:18px;\">→<\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n\n          <button type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"position:relative; align-self:center; border:none; background:none; cursor:pointer; font-family:'Jost',sans-serif; font-size:13px; letter-spacing:0.2em; color:rgba(20,49,44,0.45); padding:6px;\" style-hover=\"color:#0F3B34\">REFAZER O DIAGNÓSTICO<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#0B2A25; padding:30px 28px 34px; display:flex; flex-direction:column; gap:9px;\">\n        <div style=\"font-size:12px; letter-spacing:0.22em; color:rgba(239,234,223,0.65);\">ZÊNITE · A HORA CERTA É AGORA · POR LEONARDO PINTO<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.6; color:rgba(239,234,223,0.35);\">Material educacional. Não substitui acompanhamento de saúde nem consultoria financeira.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:940}}\">\nconst QUESTIONS = [\n  { pillar:'MIND', q:'Quando você senta pra fazer algo importante, o que costuma acontecer?', sub:'Pense na última tarefa importante que você adiou. Responda pelo que acontece na maioria das vezes, não no seu melhor dia.',\n    opts:['Foco e vou até o fim','Começo bem, mas me perco no meio','Fico enrolando pra começar','Trava. Saio pra fazer outra coisa'] },\n  { pillar:'MOTION', q:'Como está a sua energia ao longo do dia?', sub:'Considere as últimas duas semanas inteiras — e não aquele único dia em que você acordou bem.',\n    opts:['Firme, dou conta do dia','Oscila, tem dia e dia','Quase sempre cansado','Arrastado, acordo já sem pilha'] },\n  { pillar:'MONEY', q:'Como está a sua relação com dinheiro hoje?', sub:'Não é sobre quanto você ganha. É sobre como você se sente quando abre o aplicativo do banco.',\n    opts:['Tranquila, tenho controle','Dá pra levar, com algum aperto','Vivo no limite e ansioso','Medo constante, não fecho o mês'] },\n  { pillar:'MIND', q:'E as suas ideias e projetos?', sub:'Olhe para os últimos seis meses: das ideias que te empolgaram, quantas realmente saíram do papel?',\n    opts:['Tiro do papel com frequência','Tiro alguns, deixo muitos pra trás','Tenho mil ideias e quase nada sai','Morre tudo na minha cabeça'] },\n  { pillar:'MOTION', q:'Aquela promessa de treinar ou se mexer na segunda:', sub:'Vale qualquer movimento do corpo: academia, corrida, caminhada. Responda pelo que você fez, não pelo que planejou.',\n    opts:['Mantenho uma rotina','Vou e paro, vou e paro','Começo e largo em uma semana','Nunca sai do “segunda eu começo”'] },\n  { pillar:'MONEY', q:'As suas ideias de ganhar mais dinheiro:', sub:'Pense na última ideia de ganhar mais que passou pela sua cabeça. O que você fez com ela nos dias seguintes?',\n    opts:['Coloco em prática','Tento algumas','Tenho várias, nenhuma sai do papel','Nem tento, acho que não é pra mim'] },\n  { pillar:'MIND', q:'Como você fala de você mesmo quando trava ou erra?', sub:'Responda pela voz que aparece nos primeiros minutos depois do erro — sem filtro, sem a versão elegante.',\n    opts:['Ajusto e sigo, sem drama','Fico chateado, mas viro a chave','Me culpo bastante','Me detono, me acho um fracasso'] },\n  { pillar:'MOTION', q:'E o seu sono?', sub:'Pense na última semana: a que horas você deitou, quantas vezes acordou e como estava ao levantar.',\n    opts:['Durmo bem, acordo descansado','Ok, mas podia ser melhor','Durmo mal com frequência','Bagunçado, vivo devendo sono'] },\n  { pillar:'MONEY', q:'Quando você pensa no seu futuro financeiro, o que sente?', sub:'Imagine a sua vida financeira daqui a três anos mantendo tudo como está hoje. Qual é a primeira sensação?',\n    opts:['Otimismo e controle','Esperança, mas insegurança','Preocupação','Travado pelo medo'] }\n];\n\nconst SUBS = { MIND:'sua mente no comando', MOTION:'o corpo que te levanta', MONEY:'o poder da liberdade' };\nconst SHEET = 'https://script.google.com/macros/s/AKfycbzlug_ghGNAD50rfcy-DEB06gt4kVMp7rTfBzuLVS7cLIgfePv7sKeT_OEZnt0yYYbA/exec';\n\nfunction track(fn, name) {\n  try { if (typeof window !== 'undefined' && window.fbq) window.fbq(fn, name); } catch (e) {}\n}\n\nfunction sendSheet(name, form) {\n  try {\n    fetch(SHEET, {\n      method: 'POST',\n      headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n      body: JSON.stringify({ name: name, proj: 'Diagnóstico Zênite', form: form, startedAt: 0, finishedAt: Date.now(), days: 1 })\n    }).catch(function () {});\n  } catch (e) {}\n}\nconst LETTERS = ['A','B','C','D'];\n\nclass Component extends DCLogic {\n  state = { screen:'start', name:'', email:'', step:0, answers:[], reveal:false };\n\n  componentWillUnmount() { clearTimeout(this._t1); clearTimeout(this._t2); }\n\n  scores() {\n    const acc = { MIND:0, MOTION:0, MONEY:0 };\n    QUESTIONS.forEach((q,i) => { acc[q.pillar] += (this.state.answers[i] ?? 0); });\n    return { MIND: Math.round(acc.MIND/9*100), MOTION: Math.round(acc.MOTION/9*100), MONEY: Math.round(acc.MONEY/9*100) };\n  }\n\n  begin() {\n    const name = (this.state.name || '').trim();\n    const email = (this.state.email || '').trim();\n    track('track', 'Lead');\n    sendSheet(name, { f1: 'E-mail: ' + email, f2: 'Origem: diagnostico' });\n    this.setState({ screen: 'quiz', step: 0, answers: [] });\n  }\n\n  pick(v) {\n    const answers = this.state.answers.slice();\n    answers[this.state.step] = v;\n    if (this.state.step < QUESTIONS.length - 1) {\n      this.setState({ answers, step: this.state.step + 1 });\n    } else {\n      this.setState({ answers, screen:'calc' }, () => {\n        const sc = this.scores();\n        const order = ['MIND','MOTION','MONEY'];\n        const worst = order.slice().sort((a,b) => sc[a] - sc[b])[0];\n        sendSheet((this.state.name || '').trim(), {\n          f1: 'MIND ' + sc.MIND + '%',\n          f2: 'MOTION ' + sc.MOTION + '%',\n          f3: 'MONEY ' + sc.MONEY + '%',\n          f4: 'Pilar mais travado: ' + worst,\n          f5: 'E-mail: ' + (this.state.email || '').trim()\n        });\n      });\n      this._t1 = setTimeout(() => {\n        this.setState({ screen:'result', reveal:false });\n        this._t2 = setTimeout(() => this.setState({ reveal:true }), 140);\n      }, 1900);\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const q = QUESTIONS[s.step];\n    const first = (s.name || '').trim().split(' ')[0];\n    const nm = first ? first.charAt(0).toUpperCase() + first.slice(1) : 'Você';\n    const sc = this.scores();\n    const order = ['MIND','MOTION','MONEY'];\n    const worst = order.slice().sort((a,b) => sc[a] - sc[b])[0];\n    const avg = (sc.MIND + sc.MOTION + sc.MONEY) / 3;\n\n    const p1 = {\n      MIND: nm + ', a sua cabeça anda te sabotando: ideia demais, foco de menos, e aquela voz que te chama de indisciplinado.',\n      MOTION: nm + ', o seu corpo está pedindo socorro: energia baixa, sono bagunçado e a rotina que começa e para.',\n      MONEY: nm + ', o dinheiro está te prendendo pelo medo: ideias de renda que morrem na cabeça e a ansiedade de não sair do lugar.'\n    }[worst];\n\n    const p2 = avg >= 66\n      ? 'Você já se move mais do que a maioria. Ainda assim, tem uma área te segurando, e é nela que mora o teu próximo salto.'\n      : avg >= 40\n      ? 'Você entra e sai da sala de espera. Uns dias age, outros trava. Falta o sistema que te mantém em movimento mesmo nos dias ruins.'\n      : 'A verdade sem rodeio: você está fundo na sala de espera. Não por falta de vontade nem de capacidade, mas porque te ensinaram a entender tudo antes de agir. E assim ninguém sai do lugar.';\n\n    return {\n      isStart: s.screen === 'start',\n      isQuiz: s.screen === 'quiz',\n      isCalc: s.screen === 'calc',\n      isResult: s.screen === 'result',\n      nameValue: s.name,\n      emailValue: s.email,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onName: (e) => this.setState({ name: e.target.value }),\n      onNameKey: (e) => { if (e.key === 'Enter') this.begin(); },\n      start: () => this.begin(),\n      onGroup: () => track('trackCustom', 'entrar_grupo'),\n      shellHeight: s.screen === 'result' ? 'auto' : '100dvh',\n      restart: () => this.setState({ screen:'start', step:0, answers:[], reveal:false }),\n      leadEmail: s.email,\n      back: () => this.setState({ step: Math.max(0, s.step - 1) }),\n      canGoBack: s.step > 0,\n      pillarLabel: 'PILAR ' + q.pillar,\n      pillarBg: q.pillar === 'MONEY' ? 'rgba(156,134,84,0.22)' : 'rgba(15,59,52,0.09)',\n      stepLabel: String(s.step + 1).padStart(2,'0') + ' / 09',\n      ticks: QUESTIONS.map((_, i) => ({ color: i < s.step ? '#C9B27E' : (i === s.step ? '#EFEADF' : 'rgba(239,234,223,0.2)') })),\n      questionText: q.q,\n      questionSub: q.sub,\n      options: q.opts.map((label, i) => ({ label, letter: LETTERS[i], pick: () => this.pick(3 - i) })),\n      resultTitle: nm + ', o que mais te segura hoje é ' + worst + '.',\n      bars: order.map(k => ({\n        name: k,\n        sub: SUBS[k],\n        pct: sc[k] + '%',\n        tag: k === worst ? 'MAIS TRAVADO' : '',\n        width: (s.reveal ? sc[k] : 0) + '%',\n        color: k === worst ? '#9C8654' : '#0F3B34'\n      })),\n      para1: p1,\n      para2: p2\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
