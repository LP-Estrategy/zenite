<script>
/* Teste A/B: sorteia a versão (50/50) na primeira visita e guarda,
   pra pessoa sempre ver a mesma página. Pra forçar uma versão: ?v=a ou ?v=b */
(function(){
  var v,q=new URLSearchParams(location.search);
  try{v=localStorage.getItem('editai_v');}catch(e){}
  if(q.get('v')==='a'||q.get('v')==='b'){v=q.get('v');}
  else if(v!=='a'&&v!=='b'){v=Math.random()<0.5?'a':'b';}
  try{localStorage.setItem('editai_v',v);}catch(e){}
  q.delete('v');var s=q.toString();
  location.replace('/editai/'+v+'/'+(s?'?'+s:'')+location.hash);
})();
</script>
